            grid-template-rows: repeat(8, 1fr);

<body class="h-screen p-2">

<div id="app" class="h-full max-w-[1800px] mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden border-4 border-green-200 flex flex-col">
    <header class="bg-green-600 px-5 py-2 text-white flex justify-between items-center gap-4 shrink-0">
        <div class="flex items-baseline gap-4">
            <h1 class="text-2xl md:text-3xl title-font">💎 Schatzsuche: Zahlen 0–20 💎</h1>
            <p class="text-green-100 italic text-sm hidden md:block">Type the number as a German word, then dig for treasure!</p>
        </div>
        <div id="timer-display" class="bg-green-800 px-5 py-1 rounded-xl text-2xl font-bold border-2 border-green-400 min-w-[110px] text-center shadow-inner">05:00</div>
    </header>

    <!-- Setup -->
    <div id="setup-screen" class="p-10 text-center space-y-10 overflow-y-auto">
        <div>
            <h2 class="text-2xl font-bold mb-1 text-slate-700">Welche Aufgabe?</h2><p class="text-sm text-slate-500 mb-4">Choose a task type</p>
            <div class="flex flex-wrap justify-center gap-4">
                <button onclick="setMode('read', this)" class="mode-btn bg-white border-4 border-slate-200 hover:border-red-400 text-slate-700 px-6 py-4 rounded-2xl text-lg font-bold shadow transition-all">
                    👀 Lesen<br><span class="text-xs font-normal text-slate-500">See the number → type the word</span>
                </button>
                <button onclick="setMode('listen', this)" class="mode-btn bg-white border-4 border-slate-200 hover:border-blue-400 text-slate-700 px-6 py-4 rounded-2xl text-lg font-bold shadow transition-all">
                    🔊 Hören<br><span class="text-xs font-normal text-slate-500">Hear the number → type the word</span>
                </button>
                <button onclick="setMode('mixed', this)" class="mode-btn bg-white border-4 border-green-500 text-slate-700 px-6 py-4 rounded-2xl text-lg font-bold shadow transition-all">
                    🎲 Gemischt<br><span class="text-xs font-normal text-slate-500">both, at random</span>
                </button>
            </div>
        </div>
        <div>
            <h2 class="text-2xl font-bold mb-1 text-slate-700">Wie viele Abenteurer seid ihr?</h2><p class="text-sm text-slate-500 mb-4">How many teams are playing?</p>
            <div class="flex justify-center gap-6">
                <button onclick="startGame(2)" class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-4 rounded-2xl text-xl font-bold shadow-lg transition-transform active:scale-95">2 Spieler</button>
                <button onclick="startGame(3)" class="bg-purple-500 hover:bg-purple-600 text-white px-8 py-4 rounded-2xl text-xl font-bold shadow-lg transition-transform active:scale-95">3 Spieler</button>
            </div>
        </div>
        <p id="support-warning" class="hidden text-sm text-red-600 font-bold"></p>
    </div>

    <!-- Game -->
    <div id="game-screen" class="hidden flex-1 min-h-0 flex flex-row">
        <div class="w-5/12 p-3 bg-slate-50 border-r-2 border-slate-100 flex flex-col gap-2 min-h-0 overflow-hidden">
            <div id="player-board" class="grid grid-cols-3 gap-2 shrink-0"></div>

            <div id="turn-info" class="bg-white px-3 py-2 rounded-xl border-2 border-slate-200 shadow-sm text-center shrink-0">
                <p id="task-label" class="text-xs uppercase tracking-wider font-bold mb-1"></p>
                <div id="task-content" class="flex items-center justify-center"></div>
            </div>

            <div id="input-section" class="space-y-2 shrink-0">
                <div class="relative">
                    <div id="input-lock-overlay" class="absolute inset-0 z-10 bg-slate-100/80 flex items-center justify-center rounded-xl font-bold text-slate-500 text-center px-4 italic border-2 border-dashed border-slate-300 text-sm"></div>
                    <input id="answer-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" disabled
                           placeholder="…"
                           class="w-full p-3 border-2 border-slate-200 rounded-xl focus:border-green-500 outline-none transition-all text-2xl bg-slate-50 font-bold text-center">
                </div>
                <div class="flex gap-2">
                    <button id="submit-btn" onclick="checkAnswer()" disabled
                            class="flex-1 bg-green-500 hover:bg-green-600 text-white font-black py-3 rounded-xl shadow-md transition-all disabled:opacity-50 text-lg">PRÜFEN</button>
                    <button id="speaker-btn" onclick="playNumber()"
                            class="w-20 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl shadow-md flex items-center justify-center text-3xl transition-all disabled:opacity-40">🔊</button>
                </div>
                <button id="continue-btn" onclick="nextTurn()"
                        class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all animate-pulse text-xl">Weiter ➔</button>
                <p id="speech-status" class="text-sm text-center text-slate-700 min-h-[1.25rem] font-bold bg-amber-50 border border-amber-200 rounded-lg px-2 py-1"></p>
            </div>

            <div id="feedback-area" class="p-3 rounded-xl flex-1 min-h-0 overflow-hidden flex flex-col items-center justify-center text-center bg-white border-2 border-slate-100 shadow-inner"></div>
        </div>

        <div class="w-7/12 p-3 bg-white flex flex-col min-h-0">
            <div class="mb-2 flex justify-between items-center bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 shrink-0">
                <h3 id="grid-status-text" class="text-base font-bold text-slate-700 flex items-center gap-2"><span class="text-xl">📍</span> Löse die Aufgabe…</h3>
                <span id="dig-count" class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-sm font-bold shadow-sm"></span>
            </div>
            <div class="flex-1 min-h-0 p-2 bg-slate-50 rounded-xl border-2 border-slate-100">
                <div id="treasure-grid" class="gap-1.5"></div>
            </div>
        </div>
    </div>

    <!-- Finish -->
    <div id="finish-screen" class="hidden p-10 text-center overflow-y-auto">
        <h2 class="text-5xl title-font mb-2 text-green-600">Spiel beendet!</h2><p class="text-slate-500 mb-6">Game over – here are the final scores</p>
        <div id="final-ranking" class="max-w-xl mx-auto mb-10 space-y-4"></div>
        <button onclick="location.reload()" class="bg-green-600 text-white px-10 py-5 rounded-2xl text-2xl title-font hover:bg-green-700 transition-colors shadow-xl">Nochmal spielen</button>
    </div>
</div>

<script>
    // ---------- Data ----------
    const numberWords = ['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn',
                         'elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn','zwanzig'];

    const playerColours = ['blue', 'purple', 'amber'];
    const playerNames = ['Blaues Team', 'Lila Team', 'Gold Team'];

    let gameMode = 'mixed';        // 'read' | 'listen' | 'mixed'
    let roundType = 'read';        // type of the current round
    let players = [];
    let currentPlayerIndex = 0;
    let currentNumber = null;
    let lastNumber = null;
    let canDig = false;
    let gridData = [];
    const gridSize = 64;
    let timeLeft = 300;
    let timerInterval = null;
    let hasListened = false;
    let playsLeft = 3;
    const MAX_PLAYS = 3;

    // ---------- Speech synthesis ----------
    const hasTTS = 'speechSynthesis' in window;
    let germanVoices = [];
    let chosenVoice = null;

    // Quality ranking: cloud/"natural" voices first, robotic system voices last
    function voiceScore(v) {
        const n = v.name.toLowerCase();
        let sc = 0;
        if (v.lang === 'de-DE') sc += 10;
        if (n.includes('natural') || n.includes('neural') || n.includes('online')) sc += 50;   // Edge natural voices
        if (n.includes('google')) sc += 40;                                                   // Chrome cloud voice
        if (n.includes('anna') || n.includes('petra') || n.includes('markus')) sc += 20;       // macOS premium
        if (n.includes('katja') || n.includes('conrad') || n.includes('amala') || n.includes('killian')) sc += 15;
        if (n.includes('espeak')) sc -= 50;
        if (!v.localService) sc += 5;
        return sc;
    }

    function pickVoices() {
        const all = speechSynthesis.getVoices();
        germanVoices = all.filter(v => v.lang && v.lang.toLowerCase().startsWith('de')).sort((x, y) => voiceScore(y) - voiceScore(x));
        chosenVoice = germanVoices[0] || null;
    }
    if (hasTTS) {
        pickVoices();
        speechSynthesis.onvoiceschanged = pickVoices;
    }

    function speak(text, rate, onend) {
        if (!hasTTS) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'de-DE';
        u.rate = rate;
        u.pitch = 1;
        u.volume = 1;
        if (chosenVoice) u.voice = chosenVoice;
        if (onend) u.onend = onend;
        speechSynthesis.speak(u);
    }

    // Play twice: once normally, once slowly, with a short pause between
    function updateSpeakerBtn() {
        const btn = document.getElementById('speaker-btn');
        btn.innerHTML = `🔊<span class="text-xs font-bold ml-1">${playsLeft}</span>`;
        if (playsLeft <= 0) { btn.disabled = true; btn.classList.remove('speaker-highlight'); }
    }

    function playNumber() {
        if (!hasTTS || currentNumber === null || playsLeft <= 0 || speechSynthesis.speaking) return;
        playsLeft--;
        updateSpeakerBtn();
        const word = numberWords[currentNumber];
        speak(word, 0.85, () => {
            setTimeout(() => speak(word, 0.6, () => {
                if (!hasListened) { hasListened = true; unlockInput(); }
                setStatus(playsLeft > 0 ? `Now type the number as a German word, then press PRÜFEN. You can listen ${playsLeft} more time${playsLeft === 1 ? '' : 's'}.` : 'No more listens. Type the number as a German word, then press PRÜFEN.');
            }), 400);
        });
        document.getElementById('speaker-btn').classList.remove('speaker-highlight');
    }

    // ---------- Helpers ----------
    function setStatus(t) { document.getElementById('speech-status').innerText = t; }

    function normalise(str) {
        return str.toLowerCase().replace(/[.,/#!?$%^&*;:{}=\-_`~()"']/g, "").replace(/\s+/g, " ").trim();
    }

    function setMode(mode, btn) {
        gameMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.replace('border-green-500', 'border-slate-200'));
        btn.classList.replace('border-slate-200', 'border-green-500');
    }

    function unlockInput() {
        const input = document.getElementById('answer-input');
        input.disabled = false;
        input.classList.remove('bg-slate-50');
        document.getElementById('submit-btn').disabled = false;
        document.getElementById('input-lock-overlay').classList.add('hidden');
        input.focus();
    }

    // ---------- Game flow ----------
    function startGame(count) {
        const warn = document.getElementById('support-warning');
        if (gameMode !== 'read' && (!hasTTS || germanVoices.length === 0)) {
            warn.innerText = "Keine deutsche Sprachausgabe gefunden – bitte Chrome oder Edge benutzen, oder „Lesen“ wählen.";
            warn.classList.remove('hidden');
            return;
        }
        players = [];
        for (let i = 0; i < count; i++) {
            players.push({ id: i, name: playerNames[i], score: 0, correctAnswers: 0, color: playerColours[i] });
        }
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        initialiseGrid();
        updatePlayerBoard();
        startTimer();
        startNewRound();
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) { clearInterval(timerInterval); endGame(); }
        }, 1000);
    }

    function updateTimerDisplay() {
        const display = document.getElementById('timer-display');
        const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
        display.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        if (timeLeft <= 30) display.classList.add('timer-low');
    }

    function initialiseGrid() {
        const gridContainer = document.getElementById('treasure-grid');
        const rewardTypes = [
            { icon: '🪙', min: 2,  max: 6,  label: 'Münze',        n: 16 },
            { icon: '✨', min: 3,  max: 8,  label: 'Sternenstaub', n: 10 },
            { icon: '💰', min: 8,  max: 15, label: 'Geldbeutel',   n: 10 },
            { icon: '🔑', min: 5,  max: 10, label: 'Schlüssel',    n: 6 },
            { icon: '💍', min: 10, max: 18, label: 'Ring',         n: 6 },
            { icon: '🏺', min: 10, max: 20, label: 'Vase',         n: 5 },
            { icon: '💎', min: 20, max: 30, label: 'Edelstein',    n: 5 },
            { icon: '🗝️', min: 15, max: 25, label: 'Goldschlüssel', n: 3 },
            { icon: '🏆', min: 30, max: 40, label: 'Pokal',        n: 2 },
            { icon: '👑', min: 50, max: 60, label: 'Krone',        n: 1 }
        ];
        let tempRewards = [];
        rewardTypes.forEach(t => { for (let i = 0; i < t.n; i++) tempRewards.push({ ...t }); });
        while (tempRewards.length < gridSize) tempRewards.push({ ...rewardTypes[0] });
        tempRewards = tempRewards.slice(0, gridSize);

        gridData = tempRewards.sort(() => Math.random() - 0.5).map(item => ({
            icon: item.icon, label: item.label,
            points: Math.floor(Math.random() * (item.max - item.min + 1)) + item.min
        }));

        gridContainer.innerHTML = '';
        for (let i = 0; i < gridSize; i++) {
            const tile = document.createElement('div');
            tile.className = 'grid-tile bg-orange-200 border-2 border-orange-300 rounded-lg cursor-pointer flex items-center justify-center shadow-inner';
            tile.id = `tile-${i}`;
            tile.onclick = () => handleDig(i);
            gridContainer.appendChild(tile);
        }
    }

    function updatePlayerBoard() {
        document.getElementById('player-board').innerHTML = players.map((p, idx) => `
            <div class="px-3 py-2 rounded-xl border-2 transition-all ${idx === currentPlayerIndex ? `active-player bg-white shadow-lg border-${p.color}-500` : 'bg-slate-100 opacity-60 border-transparent'}">
                <div class="font-bold text-sm text-${p.color}-600 truncate">${p.name}</div>
                <div class="flex justify-between items-center mt-1">
                    <span class="bg-${p.color}-500 text-white px-2 py-0.5 rounded-full text-sm font-bold shadow-sm">${p.score} Pkt.</span>
                    <span class="text-xs text-slate-500 font-bold">✅ <span class="text-${p.color}-600">${p.correctAnswers}</span></span>
                </div>
            </div>`).join('');
    }

    function pickNumber() {
        let n;
        do { n = Math.floor(Math.random() * 21); } while (n === lastNumber);
        lastNumber = n;
        return n;
    }

    function startNewRound() {
        canDig = false;
        hasListened = false;
        playsLeft = MAX_PLAYS;
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        document.getElementById('continue-btn').classList.add('hidden');

        const input = document.getElementById('answer-input');
        const submitBtn = document.getElementById('submit-btn');
        const lockOverlay = document.getElementById('input-lock-overlay');
        const speakerBtn = document.getElementById('speaker-btn');
        const taskLabel = document.getElementById('task-label');
        const taskContent = document.getElementById('task-content');

        input.value = '';
        input.disabled = true;
        input.classList.add('bg-slate-50');
        submitBtn.disabled = true;
        lockOverlay.classList.remove('hidden');
        speakerBtn.classList.remove('speaker-highlight');

        currentNumber = pickNumber();
        roundType = gameMode === 'mixed' ? (Math.random() < 0.5 ? 'read' : 'listen') : gameMode;

        if (roundType === 'read') {
            taskLabel.className = 'text-xs uppercase tracking-wider font-bold mb-2 text-red-600';
            taskLabel.innerText = '👀 Lesen – Type this number as a German word';
            taskContent.innerHTML = `<div class="big-number text-slate-800">${currentNumber}</div>`;
            input.placeholder = 'z. B. sieben';
            speakerBtn.disabled = true;
            speakerBtn.innerHTML = '🔊';
            unlockInput();
            setStatus('Type the German word in the box (e.g. sieben), then press PRÜFEN or Enter.');
        } else {
            taskLabel.className = 'text-xs uppercase tracking-wider font-bold mb-2 text-blue-600';
            taskLabel.innerText = '🔊 Hören – Listen and type the number as a German word';
            taskContent.innerHTML = `<div class="big-number">👂</div>`;
            lockOverlay.innerText = '🔊 Click the speaker button to hear the number (max. 3 times)';
            input.placeholder = 'z. B. sieben';
            speakerBtn.disabled = false;
            speakerBtn.classList.add('speaker-highlight');
            updateSpeakerBtn();
            setStatus('Step 1: click 🔊 to listen. The box unlocks after the first listen.');
        }

        document.getElementById('feedback-area').innerHTML = `<p class="text-slate-400 italic text-base">Get the word right to earn a dig in the treasure grid!</p>`;
        document.getElementById('grid-status-text').innerHTML = '<span class="text-2xl">📍</span> Solve the task on the left first…';
        document.getElementById('dig-count').innerText = "";
        updatePlayerBoard();
    }

    document.getElementById('answer-input').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !document.getElementById('submit-btn').disabled) checkAnswer();
    });

    function checkAnswer(forced) {
        const input = document.getElementById('answer-input');
        const inputVal = forced !== undefined ? forced : input.value;
        const correctWord = numberWords[currentNumber];
        const isCorrect = normalise(inputVal) === correctWord;   // the German word is required in both modes
        const feedback = document.getElementById('feedback-area');

        input.disabled = true;
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('speaker-btn').disabled = true;
        document.getElementById('input-lock-overlay').classList.add('hidden');

        if (isCorrect) {
            players[currentPlayerIndex].correctAnswers++;
            updatePlayerBoard();
            feedback.innerHTML = `
                <div class="text-green-600 font-bold mb-1 text-lg">✅ RICHTIG!</div>
                <div class="text-slate-700 bg-green-50 px-3 py-2 rounded-lg border-2 border-green-200 w-full">
                    <p class="text-2xl font-bold">${currentNumber} = ${correctWord}</p>
                </div>`;
            canDig = true;
            setStatus('Richtig! Now click ONE tile in the treasure grid to dig →');
            document.getElementById('grid-status-text').innerHTML = '<span class="text-2xl text-green-500">⛏️</span> Korrekt! Grabe jetzt!';
            document.getElementById('dig-count').innerText = "👉 Click one tile to dig!";
        } else {
            feedback.innerHTML = `
                <div class="text-red-600 font-bold mb-1 text-lg">❌ NICHT GANZ…</div>
                <div class="flex gap-2 w-full">
                    <div class="flex-1 bg-red-50 p-2 rounded border border-red-100">
                        <p class="text-[9px] uppercase text-red-400 font-black">You typed:</p>
                        <p class="text-sm italic text-slate-600 truncate">${inputVal || "(leer)"}</p>
                    </div>
                    <div class="flex-1 bg-blue-50 p-2 rounded border border-blue-100">
                        <p class="text-[9px] uppercase text-blue-500 font-black">Correct answer:</p>
                        <p class="text-xl font-bold text-slate-800">${currentNumber} = ${correctWord}</p>
                    </div>
                </div>`;
            setStatus('Not quite – check the correct spelling below, then press Weiter for the next team.');
            document.getElementById('continue-btn').classList.remove('hidden');
            document.getElementById('grid-status-text').innerHTML = '<span class="text-2xl">👎</span> Leider falsch – no dig this time.';
        }
    }

    function handleDig(index) {
        if (!canDig) return;
        const tile = document.getElementById(`tile-${index}`);
        if (tile.classList.contains('revealed')) return;

        const content = gridData[index];
        tile.classList.add('revealed');
        tile.classList.remove('bg-orange-200', 'cursor-pointer');
        tile.classList.add('bg-white', 'treasure-reveal', 'border-slate-100');
        tile.innerText = content.icon;
        players[currentPlayerIndex].score += content.points;
        updatePlayerBoard();
        canDig = false;

        const resultText = `${content.icon} ${content.label}: +${content.points} Punkte!`;

        document.getElementById('dig-count').innerText = resultText;
        setStatus('Treasure found! Press Weiter – it\'s the next team\'s turn.');
        document.getElementById('continue-btn').classList.remove('hidden');
        if (isGridFull()) endGame();
    }

    function nextTurn() {
        currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
        startNewRound();
    }

    function isGridFull() {
        return document.querySelectorAll('.grid-tile:not(.revealed)').length === 0;
    }

    function endGame() {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('finish-screen').classList.remove('hidden');
        const ranking = [...players].sort((a, b) => b.score - a.score);
        document.getElementById('final-ranking').innerHTML = ranking.map((p, i) => `
            <div class="flex items-center justify-between bg-white p-6 rounded-2xl border-4 border-${p.color}-500 shadow-xl">
                <div class="flex flex-col">
                    <span class="text-3xl font-bold">${i + 1}. ${p.name}</span>
                    <span class="text-sm text-slate-500 font-bold">✅ ${p.correctAnswers} Zahlen richtig</span>
                </div>
                <span class="text-2xl font-bold text-green-600">${p.score} Punkte</span>
            </div>`).join('');
    }
</script>
</body>
</html>
